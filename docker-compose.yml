# Compose repo worker: worker + beat + flower.
# Postgres/redis/minio ada di compose repo API — di sini TIDAK ada `depends_on`
# ke mereka (beda compose file), digantikan `restart: unless-stopped` supaya
# worker mencoba lagi sampai infra siap.
#
# Network eksternal yang sama dengan API (buat sekali di host):
#     docker network create qc-net
networks:
  default:
    external: true
    name: qc-net

x-worker-image: &worker-image
  build:
    context: .
    dockerfile: worker/Dockerfile
  image: ${REGISTRY:-local}/qc-worker:${TAG:-latest}
  env_file: .env
  environment:
    PYTHONPATH: /app
    DWH_API_BASE_URL: ${DWH_API_BASE_URL:-http://host.docker.internal:8002}
    COLLECTION_CAMPAIGNS: ${COLLECTION_CAMPAIGNS:-}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  worker:
    <<: *worker-image
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-8}

  # Penjadwal periodik (beat_schedule di worker/celery_app.py) — cukup SATU
  # replika. Ia hanya mengirim task ke antrean; yang mengerjakan tetap `worker`.
  beat:
    <<: *worker-image
    command: celery -A worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  # Flower memakai image yang sama persis — cuma command-nya beda.
  flower:
    <<: *worker-image
    command: celery -A worker.celery_app flower --port=4005
    # Blok ini MENIMPA `environment` dari anchor (bukan menggabung), jadi
    # PYTHONPATH + DWH_API_BASE_URL wajib ditulis ulang di sini.
    environment:
      PYTHONPATH: /app
      DWH_API_BASE_URL: ${DWH_API_BASE_URL:-http://host.docker.internal:8002}
      # Flower 2.x menolak /api/* dengan 401 kecuali ini di-set (tidak ada flag
      # CLI-nya). Port 4005 jadi terbuka tanpa auth — batasi di level firewall.
      FLOWER_UNAUTHENTICATED_API: "true"
    ports:
      - "4005:4005"
